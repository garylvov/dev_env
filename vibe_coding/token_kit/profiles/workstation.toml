# workstation.toml -- the DEFAULT profile: an Ubuntu workstation.
# Every machine-specific fact the token kit needs lives in a profile file.
# Selected automatically unless `sbatch` and /oscar are both present, or
# unless you pass --profile.

name = "workstation"

[detect]
# The fallback profile: no evidence, lowest priority. Anything that does not
# match a more specific profile lands here.
priority = 0

[paths]
# Where bulk data and checkouts live on this machine.
data_root = "~"
# Campaign dir: STATE.md, ROLLOVER_REQUEST.md, supervisor log, heartbeat.
campaign_dir = "~/token_kit/campaign"
# Where evidence packets are written.
evidence_dir = "~/token_kit/evidence"
# Where `census --import` re-copies the frozen bash behaviour spec from.
reference_source = "~/token_kit/reference"

[codex]
# codex runs ON DEMAND on whatever host the session is on. There is no serving
# job and no endpoint. `launcher` is what gets exec'd; on a plain workstation
# that is codex itself.
launcher = "codex"
# "codex's home must be on node-local disk": false here. A workstation's $HOME
# is local disk already, so ~/.codex is fine and nothing is copied anywhere.
node_local_home = false
node_local_tmp_root = "/tmp"
node_local_home_prefix = "codex-home"
binary = ""
bypass_approvals = true

[host]
# May a hook be a Python program on this machine? (A workstation has no
# login-node rule; the cluster profile says no.)
python_hooks = true
slurm = false

[hook]
# PreToolUse matcher for the call-cap / routing hook. It counts tool_use blocks
# for EVERY call, so the matcher is "*". Note that a spawn is matched as
# "Agent" while a DENIED spawn reports tool_name "Task" -- match one, parse the
# other.
matcher = "*"
# Also register the SessionStart row menu (the matrix menu, <=400 tokens).
session_start = true

[settings]
# Keys merged into ~/.claude/settings.json. ONLY keys the campaign MEASURED as
# taking effect belong here. subagentPromptCacheTtl: measured flip of subagent
# cache writes from 100% ephemeral_5m to 100% ephemeral_1h. cleanupPeriodDays
# was tried and REVERTED by operator ruling; autoCompactWindow exists but was
# never shown to change behaviour. Neither is written.
subagentPromptCacheTtl = "1h"
