# lane_recycler.conf — OVERRIDES ONLY. Sourced by lane_recycler.sh.
# Shell assignments only; no logic here.
#
# THE BUDGET NUMBERS DO NOT LIVE HERE ANY MORE (2026-09-20).
# They are READ from the [budget] block of
#   /oscar/data/stellex/glvov/agrescap/canonical/agent_trigger_matrix.toml
# by the hook itself. Duplicating them here was the reader/writer-law defect
# the matrix lane was built to close: two files carrying the same three
# constants only LOOKED like a reader. Change a number in the matrix and the
# hook changes; that is a guard case in tests/guard_test.sh
# ("budget is a READ of the matrix").
#
# Precedence, highest first:
#   1. an environment variable (LANE_RECYCLER_WARN=... claude ...)
#   2. an explicit uncommented assignment in THIS file
#   3. the matrix [budget] block
#   4. the hook's own last-resort literals 150 / 230 / 250
#
# Uncomment one of these ONLY to override the matrix deliberately, and say in
# the comment why the matrix is wrong for this box. An uncommented line here
# silently wins over the table, which is exactly the drift this file caused.
#
# LANE_RECYCLER_WARN=150
# LANE_RECYCLER_FLOOR=230
# LANE_RECYCLER_HARD=250
#
# What the three mean (the matrix carries the cost argument; this is the
# mechanism):
#   WARN  the first call at or past this count is denied EXACTLY ONCE, and the
#         deny reason IS the message. One wasted call buys a delivery channel
#         proven to reach the model verbatim.
#   FLOOR from here on ONLY the lane's own out.md write and SubagentHandback
#         are permitted; everything else is denied with the count in the
#         reason. FLOOR..HARD is the state-saving margin.
#   HARD  nominal ceiling; past it the deny reason escalates to "hand back
#         NOW". It NEVER denies the out.md write: a lane that cannot save its
#         state is the exact defect this tool exists to prevent.

# Where the matrix lives. Override only for a guard run.
# LANE_RECYCLER_MATRIX="/oscar/data/stellex/glvov/agrescap/canonical/agent_trigger_matrix.toml"

# Where per-agent markers, spawn event rows and the compiled-matrix cache go.
# Never the lane dir itself except for RESPAWN_REQUEST.md, which is lane state
# and belongs with the lane.
LANE_RECYCLER_STATE="${LANE_RECYCLER_STATE:-${CLAUDE_PROJECT_DIR:-$HOME}/.lane_recycler}"

# Root of the CLI's own per-project transcripts. Overridable for the guard test
# only; the default is the real one.
LANE_RECYCLER_PROJECTS_ROOT="${LANE_RECYCLER_PROJECTS_ROOT:-$HOME/.claude/projects}"
