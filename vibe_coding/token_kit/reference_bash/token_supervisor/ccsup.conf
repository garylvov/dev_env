# ccsup.conf — sealed dials for the external rollover supervisor.
# There is NO global token cap here, by operator ruling (2026-09-19): this is a
# rollover supervisor, not a rationer. Every number the scripts use lives HERE.
# Override any key per-invocation by exporting it before calling ccsup.

# --- thresholds (context tokens of the last main-thread request) --------------
# SOFT: ask the session to bring STATE.md current itself (cheap, still cached).
: "${SOFT_TOKENS:=900000}"
# HARD: roll over regardless. Must stay BELOW the point at which NATIVE
# auto-compaction fires.
#
# MEASURED 2026-09-20, not assumed. 28 `compactMetadata` records across the five
# largest transcripts under $CLAUDE_HOME/projects/-oscar-data-stellex-glvov/:
# trigger="auto" fires at preTokens 967042 .. 1006280, median ~999800 — i.e. at
# ~1,000,000, NOT at the 250000 that settings.json carries as autoCompactWindow.
# The model in settings.json is claude-fable-5-1[1m]; `autoCompactWindow` is not
# the effective trigger for it. The two metrics are the same animal: in
# transcript 36dd7573 the last main-thread assistant record before the
# compaction reads 999519 by the jq in `context_tokens`, against preTokens
# 1000519 in the compaction record one turn later.
# 950000 sits below the EARLIEST observed auto fire (967042).
# THIS NUMBER IS PER MODEL WINDOW. For a 200k-window model use SOFT 150000 /
# HARD 180000; re-measure with the same method before trusting either.
: "${HARD_TOKENS:=950000}"
# How long, between SOFT and HARD, to let in-flight work (subagents) drain.
: "${DRAIN_WAIT_SECS:=600}"
# Transcript poll period. Measured flush lag of a live transcript was ~0.2 s,
# so 60 s is far inside the window.
: "${POLL_SECS:=60}"

# --- where state lives --------------------------------------------------------
# Campaign dir: holds AGENTS.md, STATE.md, PROMPTS.log, and the files the
# supervisor writes (ROLLOVER_REQUEST.md, ccsup.log, heartbeat, markers).
: "${CAMPAIGN_DIR:=/oscar/data/stellex/glvov/agrescap/tasks/token_spend_20260918/campaign}"
# Claude's own state roots (transcripts + the session registry).
: "${CLAUDE_HOME:=$HOME/.claude}"

# --- relaunch identity --------------------------------------------------------
# The relaunched session MUST be the same animal: same binary, same permission
# mode, same model, same settings. `launch` records the flags it was given into
# CAMPAIGN_DIR/launch.flags and `watch` re-passes exactly those on rollover;
# CLAUDE_FLAGS below is only the default when `launch` is given none.
: "${CLAUDE_BIN:=claude}"
: "${CLAUDE_FLAGS:=}"
# tmux session name prefix for the detached interactive session.
: "${TMUX_PREFIX:=ccsup}"
# Hand the relaunched session its seed as the initial prompt ARGUMENT (one line
# pointing at the seed file). 0 restores the v0 behaviour, where the seed was
# written and nobody read it, and the "autonomous" rollover needed an operator
# to attach and paste. Never `tmux send-keys`: that is forbidden outright.
: "${SEED_AS_ARG:=1}"
# After launching, resolve the new session's pid from the registry (restricted
# to the tmux pane's process subtree) and start its watcher. Without this the
# supervisor survives exactly one rollover.
: "${AUTOWATCH:=1}"
# How long to wait for the new session to appear in the registry.
: "${LAUNCH_PID_WAIT_SECS:=90}"

# --- heartbeat ----------------------------------------------------------------
# A watcher is DEAD if its heartbeat mtime is older than this. Keep it a few
# poll periods so a slow NFS stat does not declare a live watcher dead.
: "${HEARTBEAT_STALE_SECS:=240}"

# --- test seam ----------------------------------------------------------------
# The guard test points this at a recording stub so nothing is really killed.
: "${CCSUP_ROLLOVER_CMD:=}"
