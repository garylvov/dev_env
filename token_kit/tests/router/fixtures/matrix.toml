codex_model = "gpt-5.6-luna"
codex_effort = "high"
cache_ttl = "5m"
stop = "the importing copy is established from a live process environment, not from a path guess"
repo_home = "read-only"
note = "wbc-canon is read-only by default. Two copies of a module diverging is normal here; the row forces the question of which one a running process imports."

[[row]]
name = "training-code-change"
use_when = "change a reward, observation, actor/critic, sampler or curriculum in wbc-latest"
shape = "claude-plans-codex-executes"
prefer = ["claude:sonnet:high", "claude:opus:high"]
globs = ["wbc/wbc-latest/src/imprint/**", "wbc/wbc-latest/imprint_isaaclab_ext/**"]
