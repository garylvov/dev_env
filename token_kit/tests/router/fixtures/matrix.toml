# R2. MECHANISTIC WORK GOES TO CODEX, gpt-5.6-luna AT HIGH EFFORT. Rows that
#     are lookups, log reads, status read-backs and deterministic transforms
#     carry engine = "codex" + codex_model + codex_effort. Judgement rows
#     (design, stuck, harness-broker, launcher-edit, training-code-change,
#     eval-film-judge, retread-store, batch-sweep) stay on their Claude tier.
#     Every codex row names BOTH model and effort: the config default is never
#     trusted. Codex runs on a COMPUTE node only — a codex row selected from a
#     login session must fall back to the row's Claude `model`, and that
#     fallback is UNTESTED (it could not be tested from the login node).
# R3. ONE BUDGET, ALL KINDS: see [budget] below. The per-row max_calls numbers
#     are gone. Only max_report stays per row.
# R4. cache_ttl is INERT until settings.json `subagentPromptCacheTtl` is UNSET.
#     That key currently reads "1h" and overrides per-agent frontmatter, so
