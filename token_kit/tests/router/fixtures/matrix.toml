          "is the job running", "allocation", "sinfo"]
globs = []
load = "mega/05_runbook.md#r2-the-channel-law-srun-one-shots-vs-ssh-daemons"
agent = "general-purpose"
model = "sonnet"   # was haiku; operator 2026-09-20: haiku is not used here
effort = "low"
max_report = 800
engine = "codex"
codex_model = "gpt-5.6-luna"
codex_effort = "high"
cache_ttl = "5m"
stop = "the command output is quoted with the command that produced it"
repo_home = "none"
note = "WAS agent = gpu-probe. Re-pointed 2026-09-20. gpu-probe.md (2,147 B) exists ONLY as a PROJECT agent in canonical/.claude/agents and wbc-latest/.claude/agents, so it is not selectable from the work home <data-root> — verified by the selectable-agent list of a live session rooted there, which does not contain it. Measured spawns of gpu-probe across every transcript: ZERO. Its frontmatter also says model: haiku, so it cannot be installed as-is without breaking R1. This row still replaces ad-hoc opus spawns for the same question."

[[row]]
