# ===========================================================================
# TOKENNOMICS — the economics a reader must see before any row.
# Re-measured 2026-09-20 over every subagent transcript under
# ~/.claude/projects/*/*/subagents/ (3,562 agents, 347,571 calls,
# 51.34 BILLION billable context tokens = input + cache_read + cache_create).
# The command is in tools/matrix_final/measure_spend.sh; re-run it, do not
# quote these.
#
# T1. THE COST IS CALLS x STANDING CONTEXT, and cache_read is 95% of it.
#     Every call re-pays the whole accumulated context. A 97-call agent
#     measured 8.35M cache_read tokens against 194 true input tokens.
#     Therefore: the only large lever is ending agents earlier, which is
#     what [budget] below does. Nothing else in this file comes close.
#
# T2. LONG AGENTS ARE THE SPEND — corrected 2026-09-20 (second correction).
#     Counted DIRECTLY over 3,510 subagent transcripts, counting `tool_use`
#     BLOCKS (not records): 202,856 calls, median 37, mean 57.8, p25 17,
#     p75 72, p90 119, p99 266, max 5,706. **88 agents (2.5%) exceed 200
#     calls.**
#     *** RETRACTED: until 2026-09-20 this header claimed roughly four times
#     as many over-200-call agents, out of a slightly larger corpus, with a
#     median in the sixties, and put a majority share of all spend above the
#     200-call line. That count was of RECORDS, not tool_use blocks, and is
#     WRONG — the correct count is the 88 and the median 37 above. The SPEND
#     SHARE was never verified by anyone, in either direction, so no share
#     figure appears in this file at all. The retracted figures are written
#     out once, in campaigns/token_spend/STATE.md, section MEASURED, and
#     nowhere else; the guard fails if they come back here.
#     The authority is campaigns/token_spend/STATE.md, section
#     MEASURED. The budget is justified by the shape (a long tail at ~2.5%
#     of agents that the 150/230/250 band touches while leaving the median
#     of 37 alone), not by the share. ***
#
# T3. A PERSONA BODY IS NOT THE LEVER — measure before you cut.
#     Measured spend of the four persona agents, all spawns, all time:
#       grizzly-veteran   23 spawns   4,556 calls    959.1M tokens
#       job-runner        34 spawns   4,018 calls    558.9M tokens
#       architect          9 spawns     691 calls     50.9M tokens
#       bloat-killer       1 spawn       31 calls      1.7M tokens
#     = 1.57B of 51.33B, i.e. 3.1% of all subagent spend.
#     Their prose bodies were 33,815 B ~= 8.5k tokens; charged on every one
#     of those 9,296 calls that is ~20.8M tokens = 0.04% of all spend.
#     Deleting all four personas would have saved four hundredths of one
#     percent. They are compressed, not deleted, in tools/matrix_final/agents/
#     (33,815 B -> 9,708 B, -71.3%), because the cheap thing to cut was the
#     `description:` auto-selection examples (7,923 B, 23% of the zoo), which
#     a hook-routed spawn does not need at all, plus generic model knowledge.
#
# T4. A `load` POINTER IS NOT FREE, AND HERE IT COSTS MORE THAN A PERSONA.
#     Measured load targets: 07_debt_id_allocations.md 669,672 B;
#     01_rulings.md 289,671 B; 02_design_s3.md 85,193 B; KEYWORDS.md 38,169 B;
#     08_retread...md 23,587 B. A whole-file load of 07 is ~167k tokens —
#     69x the largest compressed persona body. RULE: a `load` names a SECTION
#     ANCHOR, never a whole file above ~40 KB; above that, point at
#     KEYWORDS.md and make the row's `stop` require the grep.
#
# T6. JUDGEMENT ROWS ARE MOSTLY MECHANISM — that is what `shape` exists for.
#     Replayed the router over 510 historical spawns (every 7th subagent
#     transcript; tools/lane_recycler/lane_recycler.sh is the router that ran,
#     and the TSV is in lanes/matrix_live/v0/replay.tsv). Of the 6,469 tool
#     calls inside the spawns that routed to a row, 89-95% per row are Bash or
#     Read, and of the Bash calls 59-90% are read-ish verbs (grep, ls, cat,
#     head, jq, squeue, stat, ...). Mechanistic share of ALL calls, per row:
#       stuck 90%  retread-store 82%  training-code-change 74%
#       doctrine-lookup 74%  eval-film-judge 73%  launcher-edit 69%
#       design 65%  harness-broker 59%  batch-sweep 37%
#     An opus agent re-pays its whole standing context on every one of those
#     (T1). So a judgement row is `claude-plans-codex-executes`: Claude keeps
#     the judgement, codex luna high does the reads. batch-sweep is the one
#     judgement row that stays `claude-direct` — its Bash is dispatch, not
#     reading.
#     The same replay settles the topics ruling: matching topics against the
#     PROMPT BODY sends 426 of 510 spawns (83.5%) to watch-poll-wait, which
#     REFUSES, because every brief we write contains "no background waits" and
#     "do not poll". Matching against `description` only refuses 3 of 510
#     (0.6%). Routing is on the description. Do not soften this.
#
# T5. A ROW NAMES THE CHEAPEST ENGINE AND TIER THAT IS SAFE, and must be able
#     to say why the next tier down is unsafe. Opus is for judgement rows
#     only; 166 opus agents did 20 calls or fewer — those were lookups.
# ===========================================================================

# ---------------------------------------------------------------------------
# The single call budget. One pair of numbers for every kind of agent, because
# of T1 and T2 above: a 150-call agent costs about the same as two 80-call
# segments, so ANY rework above ~20% loses and a cap of 80 loses outright;
# segmenting only pays above ~200 calls, which is exactly where the 88 agents
# of the measured tail live (2.5% of 3,510; the median agent is 37 calls and
# is never touched by this band).
# Enforced by tools/lane_recycler/lane_recycler.sh.
# ---------------------------------------------------------------------------
[budget]
warn = 150    # ONE denied call, whose reason tells the agent its count
floor = 230   # past here only a Write to the lane's own out.md + SubagentHandback
hard = 250    # the reason escalates; the out.md write is STILL never denied
# max_calls per row is deliberately absent. If a row needs a different number,
# that is a claim about the cost model and belongs in the ledger, not here.

# agent_trigger_matrix.toml — draft, 2026-09-18
#
# What this file is: one routing table. A hook is MEANT to read it before every
# Agent spawn, pick the first row whose path globs or topic words match, and
# rewrite the spawn to that row's model, budget and report cap.
#
# *** WHO READS THIS FILE, AND HOW TO VERIFY IT. Written 2026-09-20, after
#     the reader landed. The block that stood here declared this file to have
#     no reader at all; that is now false and it has been removed. Do not
#     reinstate a no-reader claim without first running the three checks
#     below and showing them fail. The guard refuses the old wording. ***
#
#   THE READER is tools/lane_recycler/lane_recycler.sh, a PreToolUse hook.
#   On a spawn (tool_name == "Agent", no agent_id) it compiles this file to
#   JSON with awk (cached on this file's mtime), picks a row, and REWRITES
#   the spawn through hookSpecificOutput.updatedInput: `model`,
#   `subagent_type`, and a header prepended to `prompt`. That rewrite is
#   PROVEN in CLI 2.1.278, not assumed — see the probe in
#   agrescap/tasks/token_spend_20260918/lanes/matrix_live/v0/out.md.
#   The same script also serves the row MENU (`lane_recycler.sh --menu`) that
#   a SessionStart hook injects as additionalContext, so the spawning thread
#   can name its row.
#
#   VERIFY IT, three commands, none of which needs a live agent:
#     1. the reader exists and names this file:
#        grep -c agent_trigger_matrix tools/lane_recycler/lane_recycler.sh   # > 0
#     2. the table actually routes, end to end:
#        printf '%s' '{"tool_name":"Agent","session_id":"v","cwd":"/tmp",
#          "tool_input":{"description":"squeue check","prompt":"x"}}' \
#          | tools/lane_recycler/lane_recycler.sh
#        # prints updatedInput naming row cluster-state
#     3. changing a number HERE changes the hook's behaviour:
#        tools/lane_recycler/tests/guard_test.sh   # case "budget is a READ"
#   If 1-3 pass, this block is true. If any fails, the reader/writer-law
#   defect is back and belongs in the debt authority.
#
# [budget] below is now a READ, not a copy: lane_recycler.conf no longer
# defines WARN/FLOOR/HARD at all — it carries only an optional explicit
# override. Change a number here and the hook changes.
# tools/matrix_final/guard_matrix.sh still checks that the rows are
# INTERNALLY sound; the recycler guard checks that they are LIVE.
#
# Where it should live when it stops being a draft:
#   <data-root>/agrescap/canonical/agent_trigger_matrix.toml
# (canonical is a git checkout, so the file is versioned; agrescap/tasks is not.)
#
# Every path below was confirmed to exist on disk on 2026-09-18 with ls/find.
# The claim that used to stand here — "every column is enforced by a mechanism
# named in enforcement.md" — was removed on 2026-09-20: NO column is enforced
# (see above), and there is no enforcement.md in this directory.
#
# Column meanings:
#   globs        path patterns, relative to <data-root>
#   topics       words/phrases matched, as whole words, against the spawn's
#                `description` field ONLY — never the prompt body. RULING
#                2026-09-20: every brief we write contains "no background
#                waits" and "do not poll", so matching topics against the
#                body sends nearly every spawn to watch-poll-wait, which
#                REFUSES. The replay measured this. Do not soften it.
#   prefer       ORDERED candidate list, one grammar for every engine:
#                  "<engine>:<model>:<effort>"
#                e.g. ["codex:gpt-6-astra:high", "claude:fable:high",
#                      "claude:opus:high"]. The router takes the FIRST
#                AVAILABLE candidate and appends an event row naming the one
#                it chose and why each earlier one was skipped — that log is
#                how the operator sees the dynamics without asking.
#                Effort is PER CANDIDATE, which is where the operator's
#                "effort should def be part of the matrix" lands.
#                Availability, a closed set: a codex candidate is unavailable
#                when the binary/launcher is absent, when the quota cooldown
#                marker is live, or when the per-host codex bound is full; a
#                claude candidate is unavailable when [concurrency] for that
#                model is full. EVERY list must END in a claude candidate, so
#                no row can be blocked by codex being maxed out (guarded).
#                A `refuse` row is the one exception: its list is empty.
#                `model`/`engine`/`codex_model`/`codex_effort`/`effort`
#                are now DERIVED views of the last/first candidate and are
#                kept only because the bash router reads them; the Python
#                port reads `prefer` and they can go.
#   use_when     one line, written for the SPAWNING thread: when to put
#                `ROW: <name>` in the spawn prompt. This is what the menu
#                shows; the menu is generated from this file, so it cannot
#                drift.
#   shape        HOW the work is split, a closed set. The operator never
#                states the strategy; the table does.
#                  codex-direct              luna high does the whole row
#                  claude-direct             the row's Claude model does it
#                  claude-plans-codex-executes
#                                            a Claude agent owns the
#                                            judgement and hands EVERY
#                                            mechanistic sub-step (lookups,
#                                            log reads, greps, deterministic
#                                            transforms) to codex luna high
#                                            through the dispatcher, by Bash
#                                            — subagents cannot spawn agents,
#                                            so the dispatcher script IS the
#                                            delegation path, not the Agent
#                                            tool
#                  refuse                    the spawn is denied with a
#                                            substitute
#   load         the smallest guidance to put in front of the agent — one file,
#                or one section of one file. Not a directory.
#   agent        subagent_type to force
#   model        sonnet | opus | fable — cheapest that is safe (NO haiku, R1)
#   engine       claude (default) | codex — which CLI runs the row
#   codex_model  gpt-5.6-luna for mechanistic rows (R2); named explicitly
#   codex_effort low | medium | high; named explicitly, never defaulted
#   cache_ttl    5m | 1h per row; INERT until subagentPromptCacheTtl is unset
#   effort       low | medium | high
#   (max_calls is gone: one [budget] for every row, at the top of this file)
#   max_report   bytes the final report may be; longer is truncated with a pointer
#   reviewer     agent that must run on the result before it can be called done
#   stop         the condition that ends the agent, in the agent's own words
#   repo_home    which of the three homes this work may write in (law 7)

# ---------------------------------------------------------------------------
# Codex dispatch. Read by the hook for every row whose engine is "codex" and
# for every `claude-plans-codex-executes` row.
# OPERATOR RULING 2026-09-20: codex is run ON DEMAND on the session's own
# host. There is NO serving job and NO endpoint file — the endpoint_file /
# max_age_s design that stood here is withdrawn, do not reinstate it. A codex
# row falls back to the row's Claude `model`, and logs a `codex_fallback`
# event row, in exactly two cases: the `codex` binary is absent from the host,
# or the dispatcher returns its refusal code. That is also R2's login-node
# fallback, which stops being untestable now that availability is a binary
# check rather than a live service.
# ---------------------------------------------------------------------------
# OPERATOR RULING 2026-09-20: "we shouldn't be blocked if codex is maxed out."
# Hence `prefer` on every row (see the column meanings) and the cooldown below:
# a QUOTA refusal from the dispatcher writes a marker, and until it expires the
# router skips codex candidates instead of paying for the same refusal on every
# spawn. absent/busy refusals do NOT arm the cooldown — they are per-call.
[codex]
run = "on-demand"
binary = "codex"
refusal_code = 42
refusal_reasons = ["absent", "busy", "quota"]
quota_cooldown_s = 1800
cooldown_marker = "codex_quota_cooldown"
agents_dir = "$AGENTS_DIR"
dispatch = "bash tools/codex_surface/codex_fleet.sh turn --model gpt-5.6-luna --effort high --message '<one mechanistic sub-step>'"

[defaults]
model = "sonnet"
engine = "claude"
effort = "medium"
max_report = 2000
cache_ttl = "1h"
reviewer = ""
# A spawn that matches no row gets these, plus a note in the brief saying it was
# unrouted. Unrouted spawns are the signal that the table needs a new row.

# ---------------------------------------------------------------------------
# Persona bodies. Four rows still name a persona rather than general-purpose,
# because for those rows the persona IS the load: the judgement it carries is
# smaller than any file that could carry it (T4). They are COMPRESSED bodies,
# not the installed ones.
#   source_dir  the compressed bodies this matrix means when it says the name
#   installed   where the harness actually reads personas from today
# The compressed bodies are NOT installed. Until the operator runs the
# deprecation recipe in tools/matrix_final/DEPRECATION.md, a spawn of
# `architect` gets the 6,802 B original, not the 1,750 B rewrite. That gap is
# open and is named in the guard's output.
# ---------------------------------------------------------------------------
[personas]
source_dir = "agrescap/canonical/tools/matrix_final/agents"
installed  = "$AGENTS_DIR"
bodies = ["architect", "grizzly-veteran", "job-runner", "bloat-killer"]
# measured, 2026-09-20:  architect 6802->1750  grizzly-veteran 6706->1888
#                        job-runner 11817->3861  bloat-killer 8490->2209
#                        total 33,815 -> 9,708 B (-71.3%)

# ---------------------------------------------------------------------------
# 1. Watching, polling, waiting. This row exists to route work AWAY from a model.
#    Measured reason: four long-lived watcher agents cost 5.4 billion tokens;
#    one of them ran 5,706 calls and grew its context to about 1M.
# ---------------------------------------------------------------------------
[[row]]
name = "watch-poll-wait"
use_when = "the ask is to watch, poll, wait for, tail, or babysit something that is still running"
shape = "refuse"
prefer = []   # a refuse row has no candidate: nothing runs
topics = ["watch", "poll", "wait", "monitor", "babysit", "keep checking",
          "until it finishes", "every N minutes", "tail the log", "when it lands"]
globs = []
load = ""
agent = "NONE"
model = "NONE"
action = "refuse-and-substitute"
# The hook denies the spawn and answers with the substitute: write a shell loop
# that appends one line per sample to a status file under
# agrescap/evidence/watch/<name>.tsv, run it with nohup, and read the file once
# when you next need it. A model may read the status file; a model may not be
# the loop.
max_report = 0
stop = "the shell loop is running and its status file exists"
repo_home = "agrescap"

[[row]]
name = "watch-readback"
use_when = "read back what a watcher's status file already recorded"
shape = "codex-direct"
prefer = ["codex:gpt-5.6-luna:high", "claude:sonnet:low"]
topics = ["read the status file", "what did the watcher see", "status file"]
globs = ["agrescap/evidence/watch/**"]
load = "agrescap/evidence/watch/README"
agent = "general-purpose"
model = "sonnet"   # was haiku; operator 2026-09-20: haiku is not used here
effort = "low"
max_report = 600
engine = "codex"
codex_model = "gpt-5.6-luna"
codex_effort = "high"
cache_ttl = "5m"
stop = "the last five rows of the named status file are quoted"
repo_home = "agrescap"

