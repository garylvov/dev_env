          "sampler", "heldout", "motion clip"]
load = "mega/KEYWORDS.md"   # T4: was mega/01_rulings.md, 289,671 B whole-file. KEYWORDS.md is the grep index; the stop below already forces the guard test. JUDGEMENT CALL - operator may prefer a named 01_rulings section anchor instead.
agent = "general-purpose"
model = "sonnet"
effort = "high"
max_report = 2500
cache_ttl = "1h"
reviewer = "bloat-killer"
note = "KEPT as reviewer, with a warning: bloat-killer has been spawned ONCE, ever (31 calls, 1.7M tokens). A reviewer criterion that has fired once is barely a live consumer; if this row runs and the reviewer still does not, the reviewer column is the next reader/writer-law defect to board. Compressed 8,490 -> 2,209 B; kept the whole Calibration section (not all duplication is evil; some coupling is natural; respect the project's stage) because that is the half that stops it from mangling working code; cut the seven-category hunting-grounds taxonomy, which is generic model knowledge."
stop = "the change and its guard test are both written, and the guard has been shown to fail without the change"
repo_home = "wbc-latest"

