agent = "general-purpose"
model = "sonnet"   # was haiku; operator 2026-09-20: haiku is not used here
effort = "low"
max_report = 1200
engine = "codex"
codex_model = "gpt-5.6-luna"
codex_effort = "high"
cache_ttl = "5m"
stop = "two samples separated in time are quoted, or the file is named and shown absent"
