# ---------------------------------------------------------------------------
# 9. Architecture and hard debugging. The only rows that are opus by default.
# ---------------------------------------------------------------------------
[[row]]
name = "design"
use_when = "compare two or three approaches and recommend one before any code is written"
shape = "claude-direct"
prefer = ["claude:opus:high", "claude:fable:high"]
topics = ["design", "architecture", "how should we structure", "plan the",
          "which approach", "trade-off"]
globs = []
load = ""
agent = "architect"
model = "opus"
effort = "high"
max_report = 4000
cache_ttl = "1h"
reviewer = "codex:gpt-6-astra:high"   # operator 2026-09-20: a design may be reviewed by astra. The reviewer column now accepts a candidate in the `prefer` grammar as well as an agent name.
stop = "two or three approaches are compared and one is recommended with its cost"
repo_home = "none"
note = "KEPT as a persona, not re-pointed. Measured: 9 spawns, 691 calls, 50.9M tokens all time — 77 calls/spawn, the cheapest persona per spawn. Its load is empty, so there is no file to replace it with; the compressed 1,750 B body IS the load. Cut: the four auto-selection <example> blocks (1,874 B, 28% of the file) and the design-pattern catalogue, which opus already knows."

[[row]]
name = "stuck"
use_when = "previous attempts failed and a root cause has to be named"
shape = "claude-plans-codex-executes"
prefer = ["claude:opus:high", "claude:fable:high"]
topics = ["already tried", "still failing", "root cause", "nothing worked",
          "third attempt"]
globs = []
load = ""
agent = "grizzly-veteran"
model = "opus"
effort = "high"
max_report = 4000
cache_ttl = "1h"
stop = "a root cause is named and shown, or the ruled-out list is handed back"
repo_home = "none"
note = "This row is the only place a call budget above 90 is allowed. It must be selected by the words above, not chosen by default. KEPT as a persona: grizzly-veteran is the most expensive agent measured (23 spawns, 4,556 calls, 959.1M tokens — 198 calls/spawn, sitting exactly on the 200-call line that only 88 of 3,510 agents cross; the share of spend above that line is UNVERIFIED and is not cited here), but the body is 0.8% of that. The lever on this row is [budget], not the prose. Compressed 6,706 -> 1,888 B; kept the reconnaissance-first order, the ranked-hypotheses step, 'verification is mandatory' and the hand-back-with-ruled-out clause; cut the war-story identity and the generic expertise list."

# ---------------------------------------------------------------------------
# 10. Batch execution. Already has an agent; this row just binds its budget.
# ---------------------------------------------------------------------------
[[row]]
name = "batch-sweep"
use_when = "run a queue of jobs, a sweep, or eval over many checkpoints"
shape = "claude-direct"   # MEASURED 2026-09-20 over the 510-spawn replay: only 37.4% of this row's Bash calls are read-ish (grep/ls/cat/jq/squeue/...), against 62-90% for every other judgement row. Its calls are DISPATCH — sbatch, srun, kills — which are irreversible acts that must stay with the agent that owns the queue. Delegating them adds a hop without removing context.
prefer = ["claude:sonnet:medium", "claude:opus:medium"]
topics = ["sweep", "run eval on all", "batch", "queue of jobs", "every checkpoint"]
globs = []
load = "mega/05_runbook.md#r1-boot-runbook"
agent = "job-runner"
model = "sonnet"
effort = "medium"
max_report = 3000
cache_ttl = "1h"
stop = "every queue item is marked done or failed in the queue file"
repo_home = "agrescap"
note = "KEPT as a persona, and it is the strongest keep. Measured: 34 spawns, 4,018 calls, 558.9M tokens. Compressed 11,817 -> 3,861 B; the ORIGINAL body instructs `pkill -f` and `pgrep -f` in three places, which laws 12 and 14 forbid and the permission layer blocks — the compressed body replaces that with resolve-named-PIDs-then-kill-then-verify-VRAM, and restates 'a wedge is no output growth, never low utilization'. Cut: the inline bash runner template and the report-format taxonomy. This is the row where compression FIXED a defect rather than only shrinking one. job-runner is the one row where a long life is the point. Its budget is high but finite, and its progress lives in a queue file on disk, so a fresh one can resume instead of a long one continuing."

# ---------------------------------------------------------------------------
# 11. Independent critique of a written design, before anyone implements it.
#     Operator 2026-09-20: "in the agent trigger matrix, I want to also
#     sometimes delegate reviewing a design to astra" and "for the design
#     review, could also do the fable. I want it to be highly dynamic. E.g.
#     prefer codex, if not available, use opus." That is what `prefer` is.
# ---------------------------------------------------------------------------
[[row]]
name = "design-review"
use_when = "a written design, plan or spec file already exists and needs an independent critique before anyone implements it"
shape = "codex-direct"
prefer = ["codex:gpt-6-astra:high", "claude:fable:high", "claude:opus:high"]
topics = ["review the design", "critique", "second opinion on the plan",
          "poke holes", "review this plan", "design review"]
globs = ["agrescap/tasks/**/*PLAN*.md", "agrescap/tasks/**/in.md",
         "agrescap/canonical/docs/curric-dawn/mega/02_design_s3.md"]
load = ""
agent = "general-purpose"
model = "opus"          # the last candidate of `prefer`, kept for the bash router
engine = "codex"
codex_model = "gpt-6-astra"
codex_effort = "high"
effort = "high"
max_report = 2500
cache_ttl = "1h"
stop = "each objection names the section it attacks and what would change the verdict"
repo_home = "none"
note = "A review is not a rewrite: this row may not edit the thing it reviews, which is why repo_home is none. astra is the first candidate because a critique is judgement done cheaply elsewhere; fable is the second because it is the cheapest Claude tier that still argues; opus is the floor so the row can never be blocked by codex being maxed out."

# ---------------------------------------------------------------------------
# Concurrency, by model. Enforced by counting live spawns, not by the built-in
# limit, which is model-blind.
# ---------------------------------------------------------------------------
[concurrency]
fable = 3
opus = 4
sonnet = 10
total = 16
# The built-in default is 20 concurrent subagents of any model. These numbers
# sit underneath it. Raise or lower them here; nothing else reads them.
# Codex-engine rows are not governed here: codex runs on compute nodes and its
# concurrency is a node question, not a spawn question.
