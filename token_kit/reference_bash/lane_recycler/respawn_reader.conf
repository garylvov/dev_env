# respawn_reader.conf — sealed dials for the respawn reader. Every number the
# reader uses lives HERE. Override any key by exporting it before the hook runs.

# How many times one lane dir may be respawned before the message flips from
# "respawn it" to "stop, read out.md yourself". A lane that has burned its
# budget three times is not converging; a fourth identical agent is spend with
# no evidence behind it.
: "${RESPAWN_MAX:=3}"

# Where the reader keeps its registry of lane dirs (one append-only TSV).
# Defaults to the recycler's own state root so both tools share one directory.
: "${RESPAWN_READER_STATE:=${LANE_RECYCLER_STATE:-${CLAUDE_PROJECT_DIR:-$HOME}/.lane_recycler}}"

# Filenames inside a lane dir. The request file is written by lane_recycler.sh
# and is NEVER modified by the reader; consumption is appended to the ledger.
: "${RESPAWN_REQUEST_NAME:=RESPAWN_REQUEST.md}"
: "${RESPAWN_LEDGER_NAME:=RESPAWN_CONSUMED.md}"
