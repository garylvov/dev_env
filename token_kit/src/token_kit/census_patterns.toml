# The census detector, as DATA rather than as code.
#
# WHY IT IS NOT IN cli.py. A scan whose pattern appears in the scanning program
# matches itself: written as Python literals, these regexes made cli.py census
# its own detector and report violations it could never clear. Keeping them
# here lets the census scan EVERY file in the kit, cli.py included, and skip
# exactly one: this one, which is data.
#
# A row is `kind` + `pattern` (Python `re` syntax). Add a row and the next
# census, the installer probe and tests/test_census.py all pick it up.
#
# TWO FAMILIES.
#   machine facts   an absolute path, a home directory, a host name, an
#                   address, a credential, a scheduler job id. These belong to
#                   whoever runs the kit, never to the kit.
#   project words   the name of a repository, a document tree, a code base or a
#                   campaign. The kit runs from anywhere, so naming one is a
#                   defect. Each of these is written with an EMPTY GROUP `(?:)`
#                   inside it: the regex still matches the word, while this
#                   file does not literally contain it -- so a person grepping
#                   the kit for the word finds nothing but real hits, and the
#                   detector does not become the thing it detects.
#
# The name of whoever is running the census is added in code, from the
# environment, because it differs per machine and must not be written down.

[[pattern]]
kind = "abs_site_path"
# An absolute path of two or more components that is not under a standard
# system root. A machine's own data root, home tree or scratch tree lands here.
pattern = '(?<![\w.$~/-])/(?!usr/|etc/|var/|tmp/|opt/|dev/|proc/|sys/|bin/|sbin/|lib/|lib64/|boot/|run/|mnt/|media/|srv/)[A-Za-z0-9_-][A-Za-z0-9_.-]*/[A-Za-z0-9_-][A-Za-z0-9_.-]*/'

[[pattern]]
kind = "home_path"
pattern = '/(?:home|users|Users)/[A-Za-z0-9_-]+'

[[pattern]]
kind = "host_name"
pattern = '\b(?:login|node|gpu|cpu|compute)[0-9]{2,4}\b'

[[pattern]]
kind = "email"
pattern = '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'

[[pattern]]
kind = "token_like"
pattern = '''(?:sk-[A-Za-z0-9_-]{16}|ghp_[A-Za-z0-9]{16}|github_pat_[A-Za-z0-9_]{20}|Bearer\s+[A-Za-z0-9._-]{16}|[Aa][Pp][Ii]_?[Kk][Ee][Yy]\s*[=:]\s*['"]?[A-Za-z0-9])'''

[[pattern]]
kind = "job_id"
pattern = '(?:job(?:id)?|jid)\D{0,12}[0-9]{6,8}'

[[pattern]]
kind = "scheduler_call"
pattern = '\b(?:s(?:)queue|s(?:)acct|s(?:)batch|s(?:)run|s(?:)cancel)\b'

[[pattern]]
kind = "project_word"
pattern = 'a(?:)grescap'

[[pattern]]
kind = "project_word"
pattern = 'st(?:)ellex'

[[pattern]]
kind = "project_word"
pattern = 'o(?:)scar'

[[pattern]]
kind = "project_word"
pattern = 'imp(?:)rint'

[[pattern]]
kind = "project_word"
pattern = 'w(?:)bc'

[[pattern]]
kind = "project_word"
pattern = 'ret(?:)read'

[[pattern]]
kind = "project_word"
pattern = 'gro(?:)ve4'

[[pattern]]
kind = "project_word"
pattern = 'cur(?:)ric'

[[pattern]]
kind = "project_word"
pattern = 'proto(?:)motions'

[[pattern]]
kind = "project_word"
pattern = 'is(?:)aac'

[[pattern]]
kind = "project_word"
pattern = '\bm(?:)ega\b'

[[pattern]]
kind = "project_word"
# A citation of one project's numbered doctrine, e.g. "law 7" or "§11".
pattern = '(?i)\bl(?:)aw [0-9]+\b'

[[pattern]]
kind = "project_word"
# A boarded debt / failure id: <letter><digits>-<TOPIC>-<n>.
pattern = '\b[A-Z][0-9]{1,3}-[A-Z][A-Z0-9]{2,}-[0-9]+\b'
