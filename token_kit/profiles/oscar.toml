# oscar.toml -- the Brown CCV "oscar" cluster. This machine is the ODD one:
# Slurm everywhere, no Python allowed on the login node for pipeline work, and
# codex needs CODEX_HOME on node-local disk because its SQLite store does not
# survive NFS locking.

name = "oscar"

[detect]
# The evidence that says "this machine is oscar". It lives HERE, in the site's
# own profile, and nowhere in any module -- that is what keeps the census at
# zero. Highest matching priority wins; the lowest is the fallback.
priority = 10
requires_cmd = ["sbatch"]
requires_dir = ["/oscar"]

[paths]
data_root = "/oscar/data/stellex/glvov"
campaign_dir = "/oscar/data/stellex/glvov/agrescap/tasks/token_spend_20260918/campaign"
evidence_dir = "/oscar/data/stellex/glvov/agrescap/evidence"
# Where `census --import` re-copies the frozen bash behaviour spec from.
reference_source = "/oscar/data/stellex/glvov/agrescap/canonical"

[codex]
# On demand, on the session's own host -- no serving job, no endpoint.
#
# node_local_home: "codex's home must be on node-local disk on this machine".
# It is TRUE here because $HOME is NFS and codex keeps its state in SQLite,
# whose POSIX locking over NFS fails on launch ("locking protocol"). When this
# is true the kit uses its OWN launcher (token_kit.codex.launcher) -- it
# prepares <node_local_tmp_root>/<node_local_home_prefix>-<user> and spawns the
# binary directly -- and a bare `codex` against the NFS home is REFUSED (rc 42
# absent), never run.
node_local_home = true
node_local_tmp_root = "/tmp"
# The SAME directory the operator's ~/run_codex.bash uses, on purpose: one
# seeded home per node serves both, and the 32 MB state DB is copied once.
node_local_home_prefix = "codex-home"
# The codex binary. Empty = ~/.local/bin/codex, else whatever is on PATH.
binary = ""
# Matches the wrapper: codex runs with approvals and its own sandbox off. The
# app-server's PER-THREAD `sandbox` request still decides what a turn may do.
bypass_approvals = true
# `launcher` is only a fallback for a machine whose home needs no node-local
# copy; with node_local_home = true the kit's launcher wins. Pass
# `--launcher ~/run_codex.bash` explicitly to route through the operator's
# wrapper instead.
launcher = "codex"

[host]
# Site rule: no Python for pipeline work on the login node. The installer's own
# Python (via uv) is light operator-sanctioned tooling, not pipeline work.
python_hooks = false
slurm = true

[hook]
matcher = "*"
# Also register the SessionStart row menu (the matrix menu, <=400 tokens).
session_start = true

[settings]
subagentPromptCacheTtl = "1h"
